<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM HCF GCD Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>LCM • HCF • GCD Calculator</h1>

    <input type="number" id="num1" placeholder="Enter First Number">
    <input type="number" id="num2" placeholder="Enter Second Number">

    <button onclick="calculate()">Calculate</button>
    <button onclick="clearData()" class="reset">Reset</button>

    <div class="result">
        <p><strong>LCM:</strong> <span id="lcm">-</span></p>
        <p><strong>HCF:</strong> <span id="hcf">-</span></p>
        <p><strong>GCD:</strong> <span id="gcd">-</span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
